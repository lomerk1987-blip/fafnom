<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phantom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    max-width: 393px;
    margin: 0 auto;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ---- STATUS BAR ---- */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 0;
    height: 54px;
  }
  .status-time { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .dynamic-island {
    width: 120px; height: 34px;
    background: #000;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
  }
  .dynamic-island::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
  }
  .status-icons { display: flex; align-items: center; gap: 7px; }

  /* ---- CONTENT ---- */
  .scroll-wrap { overflow-y: auto; height: calc(100vh - 54px); padding-bottom: 90px; }
  .content { padding: 10px 20px 0; }

  /* ---- PROFILE ---- */
  .profile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .profile-left { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }
  .profile-text .handle { font-size: 12.5px; color: #888; margin-bottom: 1px; }
  .profile-text .name { font-size: 15.5px; font-weight: 700; }
  .profile-icons { display: flex; gap: 14px; }
  .icon-circle {
    width: 38px; height: 38px;
    border: 2px solid #2a2a2e;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #ccc;
  }

  /* ---- BALANCE ---- */
  .balance-section { margin-bottom: 22px; }
  .balance-total {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.05;
    transition: all 0.3s ease;
  }
  .balance-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
  }
  .meta-dollar { font-size: 16px; font-weight: 600; color: #4ade80; }
  .meta-pct {
    background: #4ade80;
    color: #000;
    font-size: 13.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 7px;
  }

  /* ---- ACTIONS ---- */
  .actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .action-btn {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 15px 6px 13px;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    cursor: pointer; border: none; color: #fff;
    transition: opacity 0.15s;
  }
  .action-btn:active { opacity: 0.6; }
  .action-icon { color: #7c5cff; display: flex; }
  .action-label { font-size: 13px; color: #d1d1d1; font-weight: 500; }

  /* ---- CASH CARD ---- */
  .cash-card {
    background: #1c1c1e;
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 26px;
  }
  .cash-label { font-size: 13px; color: #8e8e93; margin-bottom: 3px; }
  .cash-amount { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .open-cash-btn {
    background: #7c5cff;
    color: #fff;
    border: none;
    border-radius: 22px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ---- TOKENS ---- */
  .tokens-header {
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .tokens-header .arrow { color: #555; font-size: 18px; }

  .token-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .token-left { display: flex; align-items: center; gap: 12px; }
  .token-icon-wrap { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
  .token-icon-main {
    width: 46px; height: 46px;
    border-radius: 50%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .token-icon-main img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .chain-badge {
    position: absolute;
    bottom: -1px; right: -1px;
    width: 18px; height: 18px;
    background: #000;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #000;
    overflow: hidden;
  }
  .token-name-row { display: flex; align-items: center; gap: 5px; }
  .token-name { font-size: 16px; font-weight: 700; }
  .verified-badge {
    width: 17px; height: 17px;
    background: #7c5cff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: #fff;
    font-weight: 900;
    flex-shrink: 0;
  }
  .token-qty { font-size: 13px; color: #8e8e93; margin-top: 2px; }
  .token-right { text-align: right; }
  .token-value { font-size: 16px; font-weight: 700; }
  .token-change { font-size: 14px; color: #4ade80; margin-top: 2px; }

  /* ---- BOTTOM NAV ---- */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%; transform: translateX(-50%);
    width: 393px;
    background: rgba(8,8,10,0.97);
    backdrop-filter: blur(20px);
    border-top: 1px solid #1c1c1e;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0 30px;
    z-index: 100;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: center;
    width: 50px; height: 38px;
    cursor: pointer;
    color: #555;
  }
  .nav-item.active { color: #7c5cff; }

  .home-bar {
    position: fixed; bottom: 8px;
    left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px;
    background: #fff; border-radius: 3px; opacity: 0.25;
    z-index: 200;
  }

  @keyframes pulse-green {
    0% { color: #fff; }
    30% { color: #4ade80; }
    100% { color: #fff; }
  }
  .updated { animation: pulse-green 1.2s ease; }
</style>
</head>

  <ellipse cx="18.5" cy="21" rx="1.2" ry="1.2" fill="#1c1c1c"/>
  <ellipse cx="27.5" cy="21" rx="1.2" ry="1.2" fill="#1c1c1c"/>
  <!-- Eyebrows -->
  <path d="M16 18.5 Q18.5 17 21 18.5" stroke="#c2860a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M25 18.5 Q27.5 17 30 18.5" stroke="#c2860a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Nose (prominent) -->
  <path d="M21 23 Q23 26 25 23" stroke="#e8a87c" stroke-width="1.2" fill="none"/>
  <!-- Mouth -->
  <path d="M19 27.5 Q23 29 27 27.5" stroke="#c2410c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>`;

// Chain badge SVG (Solana small logo)
const chainBadgeSvg = `
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <circle cx="8" cy="8" r="8" fill="#121212"/>
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <clipPath id="badgeClip"><circle cx="8" cy="8" r="8"/></clipPath>
  </defs>
  <g clip-path="url(#badgeClip)">
    <polygon points="3,10.5 4.5,9 13,9 11.5,10.5" fill="url(#badgeGrad)"/>
    <polygon points="3,8 4.5,6.5 13,6.5 11.5,8" fill="url(#badgeGrad)"/>
    <polygon points="4.5,5.5 6,4 13,4 11.5,5.5" fill="url(#badgeGrad)"/>
  </g>
</svg>`;

// ─── REFRESH COUNTER ─────────────────────────────────────────────────
let refreshCount = parseInt(localStorage.getItem('phantomRefresh') || '0') + 1;
localStorage.setItem('phantomRefresh', refreshCount);

const TRANSFER_AMOUNT = 4538.00;
const BASE = {
  totalBalance: 20183.90,
  totalChangeDollar: 4593.73,
  cashBalance: 5642.30
};

function jitter(val, bps = 15) {
  const seed = (Date.now() % 10000) / 10000;
  return val * (1 + (seed - 0.5) * (bps / 10000) * 2);
}

let assets = [
  {
    name: 'Collector Crypt',
    qty: '144.37K CARDS',
    value: 16523.18,
    change: 4096.24,
    icon: iconCollectorCrypt
  },
  {
    name: 'unc',
    qty: '521.13K unc',
    value: 2774.66,
    change: 487.78,
    icon: iconUnc
  },
  {
    name: 'Solana',
    qty: '10.41142 SOL',
    value: 873.20,
    change: 8.79,
    rawQty: 10.41142,
    pricePerToken: 873.20 / 10.41142,
    icon: iconSolana
  },
  {
    name: 'Neiro',
    qty: '33,035.56415 NEIRO',
    value: 8.34,
    change: 0.06,
    icon: iconNeiro
  },
  {
    name: 'doland tremp',
    qty: '415.04933 tremp',
    value: 2.13,
    change: 0.09,
    icon: iconTremp
  }
];

let totalBalance = jitter(BASE.totalBalance, 8);
let totalChangeDollar = jitter(BASE.totalChangeDollar, 5);

if (refreshCount >= 2) {
  const sol = assets[2];
  const addedTokens = TRANSFER_AMOUNT / sol.pricePerToken;
  const newQty = sol.rawQty + addedTokens;
  assets[2].value = sol.value + TRANSFER_AMOUNT;
  assets[2].rawQty = newQty;
  assets[2].qty = newQty.toFixed(5) + ' SOL';
  totalBalance = BASE.totalBalance + TRANSFER_AMOUNT;
  totalChangeDollar = BASE.totalChangeDollar;
}

assets.forEach(a => { a.value = jitter(a.value, 6); a.change = jitter(a.change, 4); });
const pct = ((totalChangeDollar / (totalBalance - totalChangeDollar)) * 100);

function fmt(n, dec = 2) {
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

document.getElementById('totalBalance').textContent = '$' + fmt(totalBalance);
document.getElementById('changeDollar').textContent = '+$' + fmt(totalChangeDollar);
document.getElementById('changePct').textContent = '+' + fmt(pct) + '%';

if (refreshCount >= 2) {
  document.getElementById('totalBalance').classList.add('updated');
}

// ─── RENDER TOKENS ────────────────────────────────────────────────────
const list = document.getElementById('tokensList');
assets.forEach(a => {
  const changeColor = a.change >= 0 ? '#4ade80' : '#f87171';
  const sign = a.change >= 0 ? '+' : '-';
  list.innerHTML += `
  <div class="token-item">
    <div class="token-left">
      <div class="token-icon-wrap">
        <div class="token-icon-main">${a.icon}</div>
        <div class="chain-badge">${chainBadgeSvg}</div>
      </div>
      <div>
        <div class="token-name-row">
          <span class="token-name">${a.name}</span>
          <div class="verified-badge">✓</div>
        </div>
        <div class="token-qty">${a.qty}</div>
      </div>
    </div>
    <div class="token-right">
      <div class="token-value">$${fmt(a.value)}</div>
      <div class="token-change" style="color:${changeColor}">${sign}$${fmt(Math.abs(a.change))}</div>
    </div>
  </div>`;
});

// ─── LIVE CLOCK ───────────────────────────────────────────────────────
(function clock() {
  const n = new Date();
  const h = n.getHours(), m = n.getMinutes().toString().padStart(2,'0');
  document.getElementById('clockDisplay').textContent = h + ':' + m;
  setTimeout(clock, 10000);
})();
</script>
</body>
</html>
